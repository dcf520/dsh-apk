name: build-apk

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-Go
          path: src

      - name: Apply capsule patch
        working-directory: src
        run: |
          set -o pipefail
          git log -1 --oneline | tee /tmp/meta.log
          git apply --3way "$GITHUB_WORKSPACE/capsule-all.patch" 2>&1 | tee /tmp/apply.log \
            || patch -p1 -F3 < "$GITHUB_WORKSPACE/capsule-all.patch" 2>&1 | tee -a /tmp/apply.log
          git diff --stat | tee -a /tmp/apply.log
          sed -i 's/applicationId = "io.github.ccch1mneyyy.dsh_app"/applicationId = "io.github.ccch1mneyyy.dsh_app.capsule"/' app/android/app/build.gradle.kts


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version 2>&1 | tee /tmp/meta.log

      - name: Resolve
        working-directory: src/app
        run: flutter pub get 2>&1 | tee /tmp/pub.log

      - name: Build runtime (arm64)
        working-directory: src
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils unzip gnupg gpgv curl
          sed -i 's/^PROOT_VERSION="5.1.107.98"/PROOT_VERSION="5.1.107.102"/' runtime/build-runtime.sh
          UPDATE_DEB_LOCK=1 bash runtime/build-runtime.sh arm64-v8a 2>&1 | tee /tmp/runtime.log

      - name: Build APK
        working-directory: src/app
        run: flutter build apk --release --flavor arm64 --target-platform android-arm64 --android-skip-build-dependency-validation 2>&1 | tee /tmp/build.log

      - name: Keep logs on failure
        if: failure()
        run: |
          mkdir -p logs
          for f in meta apply pub runtime build; do
            if [ -f "/tmp/$f.log" ]; then cp "/tmp/$f.log" "logs/$f.log"; fi
          done
          ls -l logs
          git config user.name dsh
          git config user.email dsh@local
          git add logs
          git commit -m "ci logs run $GITHUB_RUN_NUMBER [skip ci]" || true
          git push --force origin HEAD:ci-logs || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-capsule-apk
          path: src/app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: capsule-${{ github.run_number }}
          files: src/app/build/app/outputs/flutter-apk/*.apk
