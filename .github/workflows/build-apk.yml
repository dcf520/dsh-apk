name: build-apk

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-Go
          path: src

      - name: Apply capsule patch
        working-directory: src
        run: |
          git log -1 --oneline
          git apply --3way "$GITHUB_WORKSPACE/capsule-all.patch" || patch -p1 -F3 < "$GITHUB_WORKSPACE/capsule-all.patch"
          git diff --stat

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Resolve
        working-directory: src/app
        run: flutter pub get

      - name: Build runtime (arm64)
        working-directory: src
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils unzip gnupg curl
          UPDATE_DEB_LOCK=1 bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        working-directory: src/app
        run: flutter build apk --release --flavor arm64 --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: List outputs
        run: find src/app/build/app/outputs -name "*.apk" -printf "%p %s\n" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-capsule-apk
          path: src/app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: capsule-${{ github.run_number }}
          name: capsule build ${{ github.run_number }}
          files: src/app/build/app/outputs/flutter-apk/*.apk
